name: Publish website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Tola
        env:
          TOLA_VERSION: "0.8.0"
          TOLA_ARCHIVE_SHA256: "ca32339e5dba7e7ed0c7194203677b9fc26771c836c665b323e01088bb13860a"
        run: |
          archive="tola-${TOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/tola-rs/tola-ssg/releases/download/v${TOLA_VERSION}/${archive}" \
            --output "${archive}"
          echo "${TOLA_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}"
          install --mode 0755 tola "${RUNNER_TEMP}/tola"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Build with Tola
        working-directory: website
        run: |
          tola build --minify \
            --origin "${{ steps.pages.outputs.origin }}" \
            --base-path "${{ steps.pages.outputs.base_path }}/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

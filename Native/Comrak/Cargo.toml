[package]
name = "astra-comrak"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
comrak = { version = "=0.55.0", path = "../vendor/comrak", default-features = false }
rusty-mermaid = { version = "=0.2.0", default-features = false, features = ["svg"] }
syntect = { version = "=5.3.0", default-features = false, features = ["default-themes", "html", "regex-onig"] }

two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }

[profile.release]
lto = "thin"
codegen-units = 1
